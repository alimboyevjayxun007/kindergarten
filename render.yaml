services:
  - type: web
    name: kindergarten-crm
    runtime: python
    buildCommand: bash build.sh
    startCommand: bash start.sh
    disk:
      name: kindergarten-crm-sqlite
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        value: "sqlite:///./data/db.sqlite3"
      - key: SQLITE_DATA_DIR
        value: "data"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: TIME_ZONE
        value: "Asia/Tashkent"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: CSRF_COOKIE_SECURE
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SELF_PING_ENABLED
        value: "1"
      - key: SELF_PING_INTERVAL_SECONDS
        value: "600"
      - key: SELF_PING_URL
        sync: false
